<header class="top-bar">
  <a class="brand" routerLink="/"
    ><img src="icons/icon.svg" alt="" width="28" height="28" />cubetrace</a
  >
  <nav aria-label="Main">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: link.exact }"
        >{{ link.label }}</a
      >
    }
  </nav>
  <p
    class="wake-lock"
    role="status"
    data-testid="wake-lock-status"
    [attr.data-status]="wakeLockStatus()"
    [title]="wakeLockText().detail"
  >
    <span class="dot" aria-hidden="true"></span>{{ wakeLockText().label }}
  </p>
</header>
@if (missingApis && !bannerDismissed()) {
  <section class="support-banner" aria-label="Browser support" data-testid="support-banner">
    <p>
      This browser lacks {{ missingApis }}: cubetrace needs Chrome on Android, macOS or Windows.
    </p>
    <button type="button" aria-label="Dismiss" title="Dismiss" (click)="bannerDismissed.set(true)">
      ×
    </button>
  </section>
}
<main>
  <router-outlet />
</main>
<footer class="app-footer">
  <span data-testid="app-version">cubetrace {{ build.version }} · {{ build.commit }}</span>
</footer>
