name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build, e2e
    # Pinned: Playwright 1.56 installs its browser dependencies for Ubuntu up to 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      # The Firestore rules' tests, and the functions' (signed uploads), run against the Firestore
      # emulator: a Java program (Java 21 or later) that the Firebase CLI downloads once per version,
      # into this cache.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package.json') }}
          restore-keys: firebase-emulators-
      - run: npm run test:rules
      - run: npm run test:functions

      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # The cloud project: the app's own Firebase SDK against the Auth, Firestore and Functions
      # emulators, its uploads into a sink on the runner (BUCKET_PROVIDER=local). The Firestore
      # emulator's jar comes from the cache above; the other two are part of the CLI. Its report, on a
      # failure, is the one the next step uploads.
      - run: npm run e2e:cloud

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/e2e/playwright-report/
          retention-days: 14
