name: Pages

# Publishes main to https://shermam.github.io/cubetrace/ (Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build -- --base-href /cubetrace/

      # GitHub Pages serves 404.html for unknown paths, so deep links (/cubetrace/settings) reach the router.
      - run: cp apps/web/dist/web/browser/index.html apps/web/dist/web/browser/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist/web/browser/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Enabling Pages needs a token with admin rights, which GITHUB_TOKEN lacks; until the owner
      # enables Pages (docs/USER-ACTIONS.md) this step fails and nothing is deployed.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v5
